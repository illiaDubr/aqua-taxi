version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: aqua-mysql
    restart: always
    environment:
      MYSQL_DATABASE: aqua
      MYSQL_USER: user
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me
      TZ: Europe/Kyiv
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - aqua
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uuser -pchange-me --silent"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqua-app
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      TZ: Europe/Kyiv
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aqua
    working_dir: /var/www
    volumes:
      # app и nginx смотрят на один и тот же код
      - .:/var/www
      - ./storage:/var/www/storage
    command: >
      sh -lc "
        set -e;

        echo '[app] Fix permissions';
        chown -R www-data:www-data storage bootstrap/cache || true;
        chmod -R ug+rwX storage bootstrap/cache || true;

        if [ ! -f vendor/autoload.php ]; then
          echo '[app] vendor missing, running composer install';
          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction;
          else
            echo '[warn] composer not found, vendor missing';
          fi
        fi;

        echo '[app] Clear and build caches';
        php artisan optimize:clear || true;
        php artisan config:cache  || true;
        php artisan route:cache   || true;
        php artisan view:cache    || true;

        echo '[app] Run migrations';
        php artisan migrate --force --no-interaction || true;

        echo '[app] Start php-fpm';
        php-fpm -F
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'exit((int)!function_exists(\"opcache_reset\"));'"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: aqua-nginx
    restart: always
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # тот же код, что и у app
      - .:/var/www:ro
      - ./storage:/var/www/storage:ro

      # nginx конфиги
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/cors_map.conf:/etc/nginx/conf.d/cors_map.conf:ro

      # SSL сертификаты (если используются)
      - /etc/nginx/ssl:/certs:ro
    networks:
      - aqua
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql-data:

networks:
  aqua:
    driver: bridge
