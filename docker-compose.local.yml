services:
  mysql:
    image: mysql:8.0
    container_name: aqua-mysql-local
    environment:
      MYSQL_DATABASE: aqua
      MYSQL_USER: aqua
      MYSQL_PASSWORD: aqua
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Kyiv
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-local:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uaqua -paqua --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqua-app-local
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -lc "
        php artisan migrate:fresh &&
        php-fpm -F
      "

  nginx:
    image: nginx:alpine
    container_name: aqua-nginx-local
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql-data-local:
